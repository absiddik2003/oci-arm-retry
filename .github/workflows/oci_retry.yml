name: OCI ARM Safe Retry

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      dry_run:
        description: 'Run in Dry Run mode (no actual provisioning)'
        required: false
        default: false
        type: boolean
      max_attempts:
        description: 'Maximum retry attempts for this job'
        required: false
        default: 2
        type: number

concurrency:
  group: oci-arm-provisioning
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # Bounded job duration to avoid excessive Actions consumption
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install oci

      - name: Set up OCI credentials
        env:
          OCI_USER:        ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY:     ${{ secrets.OCI_TENANCY }}
          OCI_REGION:      ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

      - name: Run OCI ARM Retry Script
        id: run_script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          MAX_ATTEMPTS="${{ inputs.max_attempts }}"
          if [ -z "$MAX_ATTEMPTS" ]; then
            MAX_ATTEMPTS="2"
          fi
          python oci_retry.py --max-attempts "$MAX_ATTEMPTS" $EXTRA_FLAGS

      - name: Auto-disable workflow on success
        if: steps.run_script.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Disabling workflow after successful provisioning/detection..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/oci_retry.yml/disable)
          echo "Disable HTTP response: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
            echo "Workflow successfully disabled."
          else
            echo "Note: Workflow disable returned status $STATUS_CODE (may require admin PAT)."
          fi
